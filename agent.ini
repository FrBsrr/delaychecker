# receiver_agent.ini - B makinesi ayarlari
# Topoloji: A --TCP--> B (baska uygulama dinliyor, biz sadece izliyoruz)
#
# !!! DEGISTIRILMELIDIR !!!
# Asagidaki YOUR_* degerleri placeholder'dir. Gercek kurulumunuz icin
# kendi IP/adapter degerlerinizi girin. Degistirmezseniz scapy BPF filtresi
# gecersiz olur ve HIC paket yakalanmaz (fail-loud: hata acik belli olur).
# Ayrinti: SISTEM_DOKUMANI.md Bolum 7.4 ve Bolum 11 (Hizli Baslangic).

[network]
# B makinesi IP (bu makinenin IP'si)
local_ip        = YOUR_B_IP

# A makinesi IP (paketin geldigi kaynak)
source_ip       = YOUR_A_IP

# Izlenecek TCP portu
tcp_port        = 8088

# B'nin network adapter adi (sudo python -c "from scapy.all import get_if_list; print get_if_list()" ile listele)
iface           = eth0

# A makinesi IP - UDP raporu buraya gider
target_ip       = YOUR_A_IP

# UDP rapor portu (npcap_checker'daki UDP PORT ile ayni olmali)
udp_report_port = 9000

[agent]
# Kac saniyede bir sayac gonderilsin
report_interval_sec = 5

# Hangi mesaj tipleri sayilsin
watch_messages = M71

[messages]
config_file = messages.ini
